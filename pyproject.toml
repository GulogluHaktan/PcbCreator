[project]
name = "pcbcreator"
version = "0.1.0"
description = "Local-LLM multi-agent PCB design: modular sub-boards, deterministic linter, merge, Chroma memory"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.7", "httpx>=0.27", "chromadb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcbc = "pcbcreator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbcreator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
